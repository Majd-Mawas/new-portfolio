[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Explicitly enable the Next.js adapter to generate Netlify routing and functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The Web3Forms contact form requires no Netlify environment variables.
